name: Release Agent Binaries

on:
  release:
    types: [published]

jobs:
  agent-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Same build flags as apps/agent/Dockerfile (CGO_ENABLED=0 -trimpath
      # -ldflags "-s -w"), cross-compiled for the platforms the image is
      # built for, with the release tag stamped into the binary
      # (-X main.version). Assets land on the release as
      # tyz-agent-<tag>-<os>-<arch>.tar.gz + a checksums file.
      - name: Build agent binaries
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="${RUNNER_TEMP}/dist"
          mkdir -p "$out"
          cd apps/agent
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="tyz-agent-${tag}-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${tag}" -o "$out/${name}/tyz-agent" .
            tar -czf "$out/${name}.tar.gz" -C "$out/${name}" tyz-agent
            rm -r "$out/${name}"
          done
          (cd "$out" && sha256sum -- *.tar.gz > "tyz-agent-${tag}-checksums.txt")

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${RUNNER_TEMP}/dist"/* --clobber
