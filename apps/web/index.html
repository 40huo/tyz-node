<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TYZ — GOST 隧道管理控制台：节点、隧道、转发规则、用户与流量配额管理" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101013" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Cpath d='M9 10.5h14V14h-5.3v7.5h-3.4V14H9z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>TYZ 控制台</title>
    <script>
      // 在首帧之前应用持久化主题，避免暗色模式闪烁
      (() => {
        var stored = localStorage.getItem("tyz-theme");
        var dark =
          stored === "dark" ||
          (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
